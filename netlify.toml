# Déploiement Netlify : compilation Vite, puis toutes les routes renvoyées vers index.html
# pour que les liens directs (/acheter, /biens/...) et le rafraîchissement fonctionnent.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour les fichiers versionnés (noms avec empreinte) et les photos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
